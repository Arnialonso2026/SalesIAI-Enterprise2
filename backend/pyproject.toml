[project]
name = "salesia-enterprise-api"
version = "0.1.0"
description = "API empresarial de gestión comercial para SalesIA Enterprise"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
